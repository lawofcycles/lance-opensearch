buildscript {
    ext {
        opensearch_version = System.getProperty("opensearch.version", "3.8.0")
        opensearch_group = "org.opensearch"
    }

    repositories {
        mavenLocal()
        maven { url "https://ci.opensearch.org/ci/dbc/snapshots/maven/" }
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }

    dependencies {
        classpath "${opensearch_group}.gradle:build-tools:${opensearch_version}"
    }
}

plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'idea'
    id 'eclipse'
    id 'com.diffplug.spotless' version '8.10.2' apply false
}

apply from: 'gradle/formatting.gradle'
apply plugin: 'opensearch.opensearchplugin'
apply plugin: 'opensearch.pluginzip'
apply plugin: 'opensearch.rest-test'

opensearchplugin {
    name 'opensearch-lance'
    description 'Distributed search layer over Lance tables for OpenSearch (RFC #22643)'
    classname 'org.opensearch.lance.LancePlugin'
    licenseFile = rootProject.file('LICENSE.txt')
    noticeFile = rootProject.file('NOTICE.txt')
}

java {
    targetCompatibility = JavaVersion.VERSION_21
    sourceCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url "https://ci.opensearch.org/ci/dbc/snapshots/maven/" }
}

dependencies {
    api "org.opensearch:opensearch:${opensearch_version}"

    // Apache Arrow — bundle the modules needed at runtime because the
    // arrow-base plugin is not distributed with the OpenSearch release
    // image. arrow-memory-unsafe stays as the allocator (arrow-memory-netty
    // does not work under OpenSearch's -Dio.netty.noUnsafe=true).
    // TODO(pre-transfer): switch to extendedPlugins = ['arrow-base'] once
    // opensearch-project ships arrow-base in the plugin distribution.
    implementation "org.apache.arrow:arrow-vector:${arrow_version}"
    implementation "org.apache.arrow:arrow-memory-core:${arrow_version}"
    implementation "org.apache.arrow:arrow-dataset:${arrow_version}"
    implementation "org.apache.arrow:arrow-format:${arrow_version}"
    implementation "org.apache.arrow:arrow-c-data:${arrow_version}"
    implementation "com.google.flatbuffers:flatbuffers-java:${flatbuffers_version}"
    implementation "org.slf4j:slf4j-api:${slf4j_version}"
    implementation "commons-codec:commons-codec:${commons_codec_version}"

    // lance-core's JNI native library loader delegates to questdb's JarJniLoader.
    // The dependency is declared in lance-core's POM but its ${arrow.version} /
    // ${opentelemetry.version} properties are unresolved there, so Gradle drops
    // the entire dependency block. Redeclare explicitly so it lands on the
    // runtime classpath.
    implementation "org.questdb:jar-jni:${questdb_jar_jni_version}"

    // Lance native (JNI). Exclusions:
    //   jackson-core: provided by OpenSearch core, bundling causes jar hell
    //   arrow-memory-netty: OpenSearch runs Netty with -Dio.netty.noUnsafe=true,
    //     which breaks the Netty allocation manager. Use arrow-memory-unsafe instead
    //     (requires -Darrow.allocation.manager.type=Unsafe at runtime).
    implementation("org.lance:lance-core:${lance_core_version}") {
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
        exclude group: 'org.apache.arrow', module: 'arrow-memory-netty'
    }
    // Lance Namespace core library. The RFC's Attaching a table section
    // describes registering a Lance Namespace catalog as the primary path
    // for surfacing tables; DirectoryNamespace covers filesystem catalogs
    // today and the same interface will accept REST catalogs (Glue, Unity,
    // Iceberg REST) as the namespace ecosystem matures.
    implementation("org.lance:lance-namespace-core:${lance_namespace_version}") {
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
    }
    // Provides the request and response model classes that DirectoryNamespace
    // (in lance-core) refers to across the module boundary.
    implementation("org.lance:lance-namespace-apache-client:${lance_namespace_version}") {
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
    }
    implementation "org.apache.arrow:arrow-memory-unsafe:${arrow_version}"

    // Jackson databind + annotations are required at runtime by arrow-vector
    // but are not shipped in the OpenSearch image (only jackson-core is).
    // Bundle them here; jackson-core comes from OpenSearch core, so exclude it
    // from the transitive graph to avoid jar hell.
    implementation("com.fasterxml.jackson.core:jackson-databind:${jackson_databind_version}") {
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-annotations'
    }
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jackson_annotations_version}"

    // Apache Calcite is the query planner foundation and Substrait Java's
    // isthmus module supplies the Calcite RelNode to Substrait plan bridge
    // (SubstraitRelVisitor). The build resolves no transitive dependencies
    // for third-party groups, so the closure is declared explicitly and
    // "excluding" an artifact means not declaring it. The plugin does not
    // use Calcite's SQL parser, JDBC driver, or Enumerable runtime, so
    // Janino, calcite-server, and the Avatica remote metrics stay out; the
    // geo (JTS / proj4j) and statistics (datasketches, uzaygezen,
    // aggdesigner) paths are equally unused. calcite-linq4j must ship:
    // creating any character type walks SqlCollation's static initializer
    // into CalciteTrace, which loads linq4j's Functions class.
    // protobuf-java and jackson-dataformat-yaml come from the OpenSearch
    // core classpath.
    // calcite-core 1.39.0 is the version isthmus 0.57.0 declares in its
    // POM and was compiled against.
    implementation "org.apache.calcite:calcite-core:${calcite_version}"
    implementation "org.apache.calcite:calcite-linq4j:${calcite_version}"
    implementation "org.apache.calcite.avatica:avatica-core:${avatica_version}"
    implementation "com.google.guava:guava:${guava_version}"
    implementation "com.google.guava:failureaccess:${failureaccess_version}"
    implementation "io.substrait:core:${substrait_version}"
    implementation "io.substrait:isthmus:${substrait_version}"
    // Substrait's SimpleExtension loader deserialises extension YAML with
    // the Jdk8Module (Optional fields on the model classes). Not shipped
    // by OpenSearch core, so bundle it at the plugin's Jackson version.
    implementation("com.fasterxml.jackson.datatype:jackson-datatype-jdk8:${jackson_databind_version}") {
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-annotations'
    }

    // lance-namespace-apache-client 0.11.1+ uses JavaTimeModule for
    // ISO-8601 handling on the request/response models (timestamp fields
    // added in namespace 0.11's REST spec). Not bundled by OpenSearch
    // core, so ship it here alongside jackson-databind. Exclude the
    // annotations transitive because we already bring our own.
    implementation("com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jackson_databind_version}") {
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-annotations'
    }

    testImplementation "org.opensearch.test:framework:${opensearch_version}"

    // Test-fixtures source set carries reusable Lance-writing helpers
    // (e.g. LanceTableFactory) that both `test` and `integTest` consume
    // without publishing them as production code. Arrow and Lance are
    // needed at compile time; OpenSearch's test framework is not (the
    // fixtures do not extend OpenSearchTestCase). Jackson / SLF4J
    // exclusions mirror the main dependencies block so the test-fixtures
    // classpath does not fail the opensearchplugin's strict version
    // conflict check with a duplicated Jackson.
    testFixturesImplementation("org.apache.arrow:arrow-vector:${arrow_version}") {
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson.datatype'
        exclude group: 'com.fasterxml.jackson.module'
        exclude group: 'com.fasterxml.jackson.jaxrs'
        exclude group: 'com.fasterxml.jackson'
        exclude group: 'org.slf4j'
        exclude group: 'com.google.errorprone'
        exclude group: 'com.google.guava'
        exclude group: 'commons-codec'
        exclude group: 'com.google.flatbuffers'
        exclude group: 'org.apache.httpcomponents.client5'
        exclude group: 'org.apache.httpcomponents.core5'
    }
    testFixturesImplementation("org.apache.arrow:arrow-memory-core:${arrow_version}") {
        exclude group: 'org.slf4j'
        exclude group: 'commons-codec'
    }
    testFixturesImplementation("org.apache.arrow:arrow-c-data:${arrow_version}") {
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson.datatype'
        exclude group: 'com.fasterxml.jackson.module'
        exclude group: 'org.slf4j'
        exclude group: 'commons-codec'
        exclude group: 'com.google.flatbuffers'
    }
    testFixturesImplementation("org.lance:lance-core:${lance_core_version}") {
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson.datatype'
        exclude group: 'com.fasterxml.jackson.module'
        exclude group: 'com.fasterxml.jackson.jaxrs'
        exclude group: 'com.fasterxml.jackson'
        exclude group: 'org.apache.arrow'
        exclude group: 'org.slf4j'
        exclude group: 'com.google.errorprone'
        exclude group: 'com.google.guava'
        exclude group: 'commons-codec'
        exclude group: 'com.google.flatbuffers'
        exclude group: 'org.apache.httpcomponents.client5'
        exclude group: 'org.apache.httpcomponents.core5'
    }
}

// Collapse the Apache Arrow, Jackson, Calcite, Substrait, and Guava jars
// into single license/notice entries.
tasks.named("dependencyLicenses").configure {
    mapping from: /arrow-.*/, to: 'arrow'
    mapping from: /jackson-.*/, to: 'jackson'
    mapping from: /calcite-.*/, to: 'calcite'
    mapping from: /avatica-.*/, to: 'avatica'
    mapping from: /guava|failureaccess/, to: 'guava'
    // io.substrait's core artifact is named core-<version>.jar.
    mapping from: /^(core|isthmus)$/, to: 'substrait'
}

// lance-core references API surface from libraries that are either provided
// at runtime by other OpenSearch plugins (Apache Arrow through arrow-base)
// or optional at compile time (metrics, alternate JNI loaders, the separately
// distributed lance-namespace client). thirdPartyAudit is a static bytecode
// scan and cannot see these facts on its own, so the references are enumerated
// explicitly here.
tasks.named('thirdPartyAudit').configure {
    ignoreMissingClasses(

        // Janino code generation backing the Enumerable convention and JaninoRelMetadataProvider. The plugin uses the reflective metadata provider, so Janino is not bundled.
        'org.codehaus.commons.compiler.CompilerFactoryFactory',
        'org.codehaus.commons.compiler.IClassBodyEvaluator',
        'org.codehaus.commons.compiler.ICompilerFactory',
        'org.codehaus.commons.compiler.ISimpleCompiler',
        'org.codehaus.commons.compiler.util.resource.ResourceFinder',
        'org.codehaus.janino.ClassBodyEvaluator',
        'org.codehaus.janino.JavaSourceClassLoader',
        'org.codehaus.janino.util.ClassFile',

        // Calcite SQL DDL parser from calcite-server, referenced by isthmus's SQL entry points. The plugin converts RelNode plans only and never parses SQL, so calcite-server is not bundled.
        'org.apache.calcite.sql.parser.ddl.SqlDdlParserImpl',

        // Avatica remote JDBC metrics. The plugin never opens an Avatica connection, so avatica-metrics is not bundled.
        'org.apache.calcite.avatica.metrics.MetricsSystem',
        'org.apache.calcite.avatica.metrics.Timer',
        'org.apache.calcite.avatica.metrics.Timer$Context',
        'org.apache.calcite.avatica.metrics.noop.NoopMetricsSystem',

        // Calcite geospatial functions (JTS 1.19 additions and proj4j). The plugin maps no geo types through Calcite, so the geo path is unreachable.
        'org.locationtech.jts.algorithm.InteriorPoint',
        'org.locationtech.jts.geom.util.GeometryFixer',
        'org.locationtech.jts.io.geojson.GeoJsonReader',
        'org.locationtech.jts.io.geojson.GeoJsonWriter',
        'org.locationtech.jts.operation.buffer.OffsetCurve',
        'org.locationtech.jts.triangulate.polygon.ConstrainedDelaunayTriangulator',
        'org.locationtech.jts.triangulate.tri.Tri',
        'org.locationtech.proj4j.CRSFactory',
        'org.locationtech.proj4j.CoordinateReferenceSystem',
        'org.locationtech.proj4j.CoordinateTransform',
        'org.locationtech.proj4j.CoordinateTransformFactory',
        'org.locationtech.proj4j.ProjCoordinate',
        'org.locationtech.proj4j.proj.Projection',

        // Calcite statistics and lattice tooling (datasketches HLL, uzaygezen space filling curves, Pentaho aggregate designer). Unreachable without lattices or the profiler.
        'com.google.uzaygezen.core.BacktrackingQueryBuilder',
        'com.google.uzaygezen.core.BitVector',
        'com.google.uzaygezen.core.BitVectorFactories',
        'com.google.uzaygezen.core.CompactHilbertCurve',
        'com.google.uzaygezen.core.FilteredIndexRange',
        'com.google.uzaygezen.core.Query',
        'com.google.uzaygezen.core.SimpleRegionInspector',
        'com.google.uzaygezen.core.ranges.LongRange',
        'com.google.uzaygezen.core.ranges.LongRangeHome',
        'com.yahoo.sketches.hll.HllSketch',
        'com.yahoo.sketches.hll.HllSketchBuilder',
        'org.pentaho.aggdes.algorithm.Algorithm',
        'org.pentaho.aggdes.algorithm.Algorithm$ParameterEnum',
        'org.pentaho.aggdes.algorithm.Result',
        'org.pentaho.aggdes.model.Aggregate',
        'org.pentaho.aggdes.model.Attribute',
        'org.pentaho.aggdes.model.Dialect',
        'org.pentaho.aggdes.model.Schema',
        'org.pentaho.aggdes.model.StatisticsProvider',
        'org.pentaho.aggdes.model.Table',

        // Calcite JSON_* SQL functions (jayway json-path). The plugin does not evaluate SQL functions.
        'com.jayway.jsonpath.Configuration',
        'com.jayway.jsonpath.Configuration$ConfigurationBuilder',
        'com.jayway.jsonpath.DocumentContext',
        'com.jayway.jsonpath.InvalidPathException',
        'com.jayway.jsonpath.JsonPath',
        'com.jayway.jsonpath.Option',
        'com.jayway.jsonpath.Predicate',
        'com.jayway.jsonpath.spi.json.JacksonJsonProvider',
        'com.jayway.jsonpath.spi.mapper.MappingProvider',

        // Apache Commons utilities used by Calcite's SQL function library, DDL executors, and the Hilbert curve indexer. Unreachable from planning APIs.
        'org.apache.commons.dbcp2.BasicDataSource',
        'org.apache.commons.io.IOUtils',
        'org.apache.commons.lang.StringEscapeUtils',
        'org.apache.commons.lang3.StringUtils',
        'org.apache.commons.lang3.mutable.MutableBoolean',
        'org.apache.commons.math3.fraction.BigFraction',
        'org.apache.commons.math3.util.CombinatoricsUtils',
        'org.apache.commons.text.similarity.LevenshteinDistance',

        // Avatica remote JDBC HTTP client. The plugin never opens an Avatica connection.
        'org.apache.hc.client5.http.SystemDefaultDnsResolver',
        'org.apache.hc.client5.http.auth.AuthScope',
        'org.apache.hc.client5.http.auth.Credentials',
        'org.apache.hc.client5.http.auth.CredentialsProvider',
        'org.apache.hc.client5.http.auth.KerberosConfig',
        'org.apache.hc.client5.http.auth.KerberosConfig$Builder',
        'org.apache.hc.client5.http.auth.UsernamePasswordCredentials',
        'org.apache.hc.client5.http.classic.methods.HttpPost',
        'org.apache.hc.client5.http.config.RequestConfig',
        'org.apache.hc.client5.http.config.RequestConfig$Builder',
        'org.apache.hc.client5.http.impl.auth.BasicAuthCache',
        'org.apache.hc.client5.http.impl.auth.BasicCredentialsProvider',
        'org.apache.hc.client5.http.impl.classic.HttpClientBuilder',
        'org.apache.hc.client5.http.impl.io.PoolingHttpClientConnectionManager',
        'org.apache.hc.client5.http.impl.io.PoolingHttpClientConnectionManagerBuilder',
        'org.apache.hc.client5.http.routing.RoutingSupport',
        'org.apache.hc.client5.http.ssl.HttpsSupport',
        'org.apache.hc.client5.http.ssl.NoopHostnameVerifier',
        'org.apache.hc.client5.http.ssl.TlsSocketStrategy',
        'org.apache.hc.core5.http.ClassicHttpResponse',
        'org.apache.hc.core5.http.HttpHost',
        'org.apache.hc.core5.http.config.Lookup',
        'org.apache.hc.core5.http.config.RegistryBuilder',
        'org.apache.hc.core5.ssl.SSLContextBuilder',
        'org.apache.hc.core5.ssl.SSLContexts',
        'org.apache.hc.core5.util.Timeout',

        // Optional OpenTelemetry metrics instrumentation in lance-core.

        // Optional OpenTelemetry metrics instrumentation in lance-core.
        'io.opentelemetry.api.GlobalOpenTelemetry',
        'io.opentelemetry.api.OpenTelemetry',
        'io.opentelemetry.api.common.Attributes',
        'io.opentelemetry.api.common.AttributesBuilder',
        'io.opentelemetry.api.metrics.DoubleCounterBuilder',
        'io.opentelemetry.api.metrics.DoubleGaugeBuilder',
        'io.opentelemetry.api.metrics.LongCounterBuilder',
        'io.opentelemetry.api.metrics.Meter',
        'io.opentelemetry.api.metrics.MeterBuilder',
        'io.opentelemetry.api.metrics.MeterProvider',
        'io.opentelemetry.api.metrics.ObservableDoubleMeasurement',
        'io.opentelemetry.api.metrics.ObservableMeasurement',

        // Lance Namespace API model classes referenced by lance-core through
        // a factory pattern. The bundled lance-namespace-core artifact
        // supplies the LanceNamespace interface, DirectoryNamespace
        // implementation, and the request/response models the plugin
        // actually uses; the rest live in adapter artifacts that we do not
        // bundle today.

        // Apache HTTP client classes referenced by lance-namespace-apache-client
        // only through the REST client path. DirectoryNamespace, the only Lance
        // Namespace implementation the plugin exercises today, uses JNI to
        // reach the Rust core and never touches these classes at runtime.
        'org.apache.hc.client5.http.cookie.BasicCookieStore',
        'org.apache.hc.client5.http.cookie.Cookie',
        'org.apache.hc.client5.http.entity.mime.MultipartEntityBuilder',
        'org.apache.hc.client5.http.impl.classic.CloseableHttpClient',
        'org.apache.hc.client5.http.impl.classic.CloseableHttpResponse',
        'org.apache.hc.client5.http.impl.classic.HttpClients',
        'org.apache.hc.client5.http.impl.cookie.BasicClientCookie',
        'org.apache.hc.client5.http.protocol.HttpClientContext',
        'org.apache.hc.core5.http.ContentType',
        'org.apache.hc.core5.http.Header',
        'org.apache.hc.core5.http.HttpEntity',
        'org.apache.hc.core5.http.HttpResponse',
        'org.apache.hc.core5.http.io.entity.EntityUtils',
        'org.apache.hc.core5.http.io.support.ClassicRequestBuilder',
        'org.openapitools.jackson.nullable.JsonNullable',

        // Internal helpers referenced by lance-core's shaded Guava on some JVMs.
        'org.lance.shaded.guava.util.concurrent.internal.InternalFutureFailureAccess',
        'org.lance.shaded.guava.util.concurrent.internal.InternalFutures'
    )

    ignoreViolations(
        // Guava's Unsafe-based optimizations (bundled for Calcite). Same
        // classes as the shaded copies below that lance-core already carries.
        'com.google.common.cache.Striped64',
        'com.google.common.cache.Striped64$1',
        'com.google.common.cache.Striped64$Cell',
        'com.google.common.hash.LittleEndianByteArray$UnsafeByteArray',
        'com.google.common.hash.LittleEndianByteArray$UnsafeByteArray$1',
        'com.google.common.hash.LittleEndianByteArray$UnsafeByteArray$2',
        'com.google.common.hash.Striped64',
        'com.google.common.hash.Striped64$1',
        'com.google.common.hash.Striped64$Cell',
        'com.google.common.primitives.UnsignedBytes$LexicographicalComparatorHolder$UnsafeComparator',
        'com.google.common.primitives.UnsignedBytes$LexicographicalComparatorHolder$UnsafeComparator$1',
        'com.google.common.util.concurrent.AbstractFuture$UnsafeAtomicHelper',
        'com.google.common.util.concurrent.AbstractFuture$UnsafeAtomicHelper$1',
        // arrow-memory-core's Unsafe-based MemoryUtil. Also enumerated as such
        // by sandbox/plugins/parquet-data-format.
        'org.apache.arrow.memory.util.MemoryUtil',
        'org.apache.arrow.memory.util.MemoryUtil$1',
        // Shaded Guava classes in lance-core that use sun.misc.Unsafe. These are
        // standard Guava optimizations that the Guava project has shipped for
        // years and are safe on the JVMs OpenSearch supports.
        'org.lance.shaded.guava.cache.Striped64',
        'org.lance.shaded.guava.cache.Striped64$1',
        'org.lance.shaded.guava.cache.Striped64$Cell',
        'org.lance.shaded.guava.hash.LittleEndianByteArray$UnsafeByteArray',
        'org.lance.shaded.guava.hash.LittleEndianByteArray$UnsafeByteArray$1',
        'org.lance.shaded.guava.hash.LittleEndianByteArray$UnsafeByteArray$2',
        'org.lance.shaded.guava.hash.Striped64',
        'org.lance.shaded.guava.hash.Striped64$1',
        'org.lance.shaded.guava.hash.Striped64$Cell',
        'org.lance.shaded.guava.primitives.UnsignedBytes$LexicographicalComparatorHolder$UnsafeComparator',
        'org.lance.shaded.guava.primitives.UnsignedBytes$LexicographicalComparatorHolder$UnsafeComparator$1',
        'org.lance.shaded.guava.util.concurrent.AbstractFuture$UnsafeAtomicHelper',
        'org.lance.shaded.guava.util.concurrent.AbstractFuture$UnsafeAtomicHelper$1'
    )
}

test {
    // OpenSearch's BootstrapForTesting requires the javaagent-based
    // AgentPolicy module to be loaded when the test SecurityManager is
    // enabled. That module is not on the test classpath for external
    // plugins, so the SecurityManager is disabled here, matching the
    // setting used by opensearch-jvector.
    systemProperty 'tests.security.manager', 'false'

    // Match the runtime JVM options the plugin requires so tests that
    // touch Arrow allocation or Lance native loading behave the same way
    // as under a real OpenSearch node. Documented in the README as the
    // canonical launch options.
    systemProperty 'arrow.allocation.manager.type', 'Unsafe'
    jvmArgs '--add-opens=java.base/java.nio=ALL-UNNAMED'
}

publishing {
    repositories {
        maven {
            name = "localRepo"
            url = "${rootProject.buildDir}/repository"
        }
    }
    publications {
        pluginZip(MavenPublication) { publication ->
            pom {
                name = "opensearch-lance"
                description = "Distributed search layer over Lance tables for OpenSearch (RFC #22643)"
                groupId = "org.opensearch.plugin"
            }
        }
        all {
            pom {
                name = "opensearch-lance"
                description = "Distributed search layer over Lance tables for OpenSearch (RFC #22643)"
            }
            pom.withXml { XmlProvider xml ->
                Node node = xml.asNode()
                node.appendNode('inceptionYear', '2026')
                if (!node.'description') {
                    node.appendNode('description', description)
                }

                Node license = node.appendNode('licenses').appendNode('license')
                license.appendNode('name',  "The Apache License, Version 2.0")
                license.appendNode('url', "http://www.apache.org/licenses/LICENSE-2.0.txt")

                Node developer = node.appendNode('developers').appendNode('developer')
                developer.appendNode('name', 'OpenSearch')
                developer.appendNode('url', 'https://github.com/lawofcycles/lance-opensearch')
            }
        }
    }
}

// The loggerUsage precommit check requires org.opensearch.test:logger-usage,
// which is an internal opensearch-project module that is not published to
// Maven Central or the opensearch snapshot repository. External plugins
// (opensearch-jvector, this repository) cannot resolve it. Once this project
// is transferred into the opensearch-project organization and can reference
// the module directly, this override should be removed.
tasks.named('loggerUsageCheck').configure { enabled = false }

// Wire spotless into the standard `check` chain so the formatting is enforced
// alongside the rest of the precommit tasks. Use `./gradlew spotlessApply` to
// apply the formatting locally.
check.dependsOn spotlessCheck



// Integration tests spin up an OpenSearch test cluster with the plugin
// installed and drive it through REST. Standard opensearch-project pattern
// via the opensearch.rest-test gradle plugin. The runtime JVM options are
// the same set the README documents for a real node (Arrow c-data needs
// java.nio open, and the Netty allocation manager clashes with Lance's
// unsafe allocator).
// The plugin IT writes Lance tables into a directory shared between the
// test JVM and the cluster JVM. Anchoring it under project buildDir
// matches the pattern OpenSearch itself uses in modules/repository-url
// (see repositoryDir in that plugin's build.gradle) and lets `gradle
// clean` wipe leftovers.
File sharedTablesDir = new File(project.buildDir, "shared-tables")
// Snapshot ITs register an `fs` repository, and OpenSearch only accepts
// repository locations under `path.repo`. Both test clusters get the
// sibling of the shared tables directory; LanceRestTestCase.repoRoot()
// derives the same path from tests.lance.shared_tables_dir.
File sharedRepoDir = new File(project.buildDir, "shared-repo")
// The testclusters plugin writes each node's log under
// build/testclusters/<task>-<n>/logs. LanceMultiNodeIT reads the
// coordinator's fan-out lines and the executor's temporary IndexService
// lines from there to assert which nodes ran fragments.
File testClustersDir = new File(project.buildDir, "testclusters")

// Lance resolves `lindera/<name>` and `jieba/<name>` FTS tokenizers to
// dictionaries under $LANCE_LANGUAGE_MODEL_HOME (see docs/features.md).
// The dictionaries are not part of the build, so the IT that exercises
// lindera/ipadic skips itself unless the variable points at one. Pass the
// same value to the cluster JVM (where the Lance native library reads it)
// and, as a system property, to the test JVM (which decides whether to
// skip). Everything else in the suite runs regardless.
String lanceLanguageModelHome = System.getenv('LANCE_LANGUAGE_MODEL_HOME')

integTest {
    systemProperty 'tests.security.manager', 'false'
    systemProperty 'arrow.allocation.manager.type', 'Unsafe'
    jvmArgs '--add-opens=java.base/java.nio=ALL-UNNAMED'
    doFirst {
        sharedTablesDir.mkdirs()
        sharedRepoDir.mkdirs()
    }
    systemProperty 'tests.lance.shared_tables_dir', sharedTablesDir.absolutePath
    if (lanceLanguageModelHome != null) {
        systemProperty 'tests.lance.language_model_home', lanceLanguageModelHome
    }
    // The default integTest stays single-node so the dev cycle is
    // around a minute. A separate multiNodeIntegTest
    // task below runs a focused set of tests against a 3-node
    // cluster to verify multi-node fan-out without paying the
    // ~10x latency penalty on every commit.
    filter {
        excludeTestsMatching 'org.opensearch.lance.LanceMultiNodeIT'
    }
}

testClusters.integTest {
    // ARCHIVE would pull the full release tarball, but darwin-arm64 is not
    // published to artifacts.opensearch.org today (a 403 comes back on a
    // HEAD request). INTEG_TEST is a slimmer distribution built for exactly
    // this scenario and works on every platform.
    testDistribution = 'INTEG_TEST'
    plugin(project.tasks.bundlePlugin.archiveFile)
    jvmArgs('--add-opens=java.base/java.nio=ALL-UNNAMED')
    systemProperty('arrow.allocation.manager.type', 'Unsafe')
    // Speed up namespace surface for the IT. The plugin default (10s) is
    // fine for real deployments but wastes wall-clock time for tests that
    // register a table then assertBusy for the index to appear.
    setting 'lance.namespace.poll_cadence', '1s'
    setting 'path.repo', sharedRepoDir.absolutePath
    // One coordinator thread and a queue of one so the overload IT can
    // make the lance_coordinator pool refuse a request with a burst of
    // 32. The suite runs its other requests one at a time, and one
    // request needs at most the thread (its entry) plus the queue
    // slot (its merge), so nothing else is refused.
    setting 'thread_pool.lance_coordinator.size', '1'
    setting 'thread_pool.lance_coordinator.queue_size', '1'
    if (lanceLanguageModelHome != null) {
        environment 'LANCE_LANGUAGE_MODEL_HOME', lanceLanguageModelHome
    }
}

// Multi-node integTest: verifies the coordinator's fragment fan-out,
// namespace propagation across nodes, and cluster-state routing at
// scale. Kept as a separate task with a smaller test set so the
// default integTest stays fast; this one only needs to be re-run
// when the transport / dispatch / namespace paths change.
task multiNodeIntegTest(type: org.opensearch.gradle.test.RestIntegTestTask) {
    description = 'Runs the multi-node subset of integration tests against a 3-node cluster.'
    dependsOn tasks.bundlePlugin
    SourceSetContainer sourceSets = project.getExtensions().getByType(SourceSetContainer.class)
    SourceSet testSourceSet = sourceSets.getByName('test')
    setTestClassesDirs(testSourceSet.getOutput().getClassesDirs())
    setClasspath(testSourceSet.getRuntimeClasspath())

    systemProperty 'tests.security.manager', 'false'
    systemProperty 'arrow.allocation.manager.type', 'Unsafe'
    jvmArgs '--add-opens=java.base/java.nio=ALL-UNNAMED'
    doFirst {
        sharedTablesDir.mkdirs()
        sharedRepoDir.mkdirs()
    }
    systemProperty 'tests.lance.shared_tables_dir', sharedTablesDir.absolutePath
    systemProperty 'tests.lance.cluster_logs_dir', testClustersDir.absolutePath
    filter {
        includeTestsMatching 'org.opensearch.lance.LanceMultiNodeIT'
    }
}

testClusters.multiNodeIntegTest {
    testDistribution = 'INTEG_TEST'
    // Three nodes co-located on one host is enough to exercise
    // coordinator -> data-node transport fan-out, cluster-state
    // propagation of namespace metadata, and the manager-only
    // poll path.
    numberOfNodes = 3
    plugin(project.tasks.bundlePlugin.archiveFile)
    jvmArgs('--add-opens=java.base/java.nio=ALL-UNNAMED')
    systemProperty('arrow.allocation.manager.type', 'Unsafe')
    setting 'lance.namespace.poll_cadence', '1s'
    setting 'path.repo', sharedRepoDir.absolutePath
    // Same one-thread, one-slot lance_coordinator pool as integTest, so
    // the overload IT can make every coordinating node refuse requests.
    setting 'thread_pool.lance_coordinator.size', '1'
    setting 'thread_pool.lance_coordinator.queue_size', '1'
}

check.dependsOn multiNodeIntegTest
