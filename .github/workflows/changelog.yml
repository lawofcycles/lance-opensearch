name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Require a changelog fragment or skip-changelog
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json files,labels,body)
          fragments=$(jq -r '[.files[].path | select(startswith("changelog/unreleased/") and endswith(".md") and . != "changelog/unreleased/README.md")] | length' <<< "$pr")
          labelled=$(jq -r '[.labels[].name] | index("skip-changelog") != null' <<< "$pr")
          in_body=$(jq -r '(.body // "") | split("\n") | map(gsub("^\\s+|\\s+$"; "")) | index("skip-changelog") != null' <<< "$pr")
          echo "fragments changed: $fragments, skip-changelog label: $labelled, skip-changelog line in body: $in_body"
          if [ "$fragments" -eq 0 ] && [ "$labelled" != true ] && [ "$in_body" != true ]; then
            echo "::error::Add a fragment under changelog/unreleased/<section>/ (see changelog/unreleased/README.md) or opt out with the skip-changelog label or a line reading only skip-changelog in the PR description."
            exit 1
          fi

      - name: Validate the fragment tree
        run: python3 scripts/assemble-changelog.py --check
