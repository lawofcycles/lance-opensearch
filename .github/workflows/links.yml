name: Link Checker

on:
  pull_request:
    paths:
      - '**/*.md'
  schedule:
    # Every Monday 03:00 UTC: external links rot without any change in the repository.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkchecker:
    name: linkchecker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # GitHub serves a workflow's badge.svg only once the workflow file is on
      # the default branch, so a pull request that adds or renames a workflow
      # would fail on its own README badge. The badge link itself (the workflow
      # page) is still checked.
      - name: lychee Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --accept=200,403,429
            --no-progress
            --exclude 'https://github\.com/.*/actions/workflows/.*/badge\.svg'
            '**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
