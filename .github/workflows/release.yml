name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The tag names the version (v0.1.0 releases 0.1.0). It has to agree
      # with `version=` in gradle.properties, otherwise the zip the build
      # produces would not be the one the tag claims to release.
      - name: Check the tag against gradle.properties
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          declared=$(sed -n 's/^version=//p' gradle.properties)
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME names version $version but gradle.properties declares version=$declared"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version"

      - name: Build, precommit, unit, integTest, multiNodeIntegTest
        run: ./gradlew --no-daemon --console=plain build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test-results/**/TEST-*.xml
            build/testclusters/*/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      # The release notes are the `## [<version>]` block of CHANGELOG.md
      # (written by scripts/assemble-changelog.py before the tag), without
      # its heading and up to the next `## ` heading. When CHANGELOG.md has
      # no block for the version the notes point at the file instead.
      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside && NF == 0 && count == 0 { next }
            inside { lines[count++] = $0 }
            END {
              while (count > 0 && lines[count - 1] ~ /^[[:space:]]*$/) count--
              for (i = 0; i < count; i++) print lines[i]
            }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "CHANGELOG.md has no block for $VERSION, the release notes point at the file"
            echo "See CHANGELOG.md." > "$notes"
          fi
          echo "release notes:"
          cat "$notes"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "build/distributions/opensearch-lance-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
