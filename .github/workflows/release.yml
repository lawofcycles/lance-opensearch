name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Two pushes of the same tag must not race to create the same release; the
# second run waits for the first instead of being cancelled, so a release
# that is half created is never abandoned.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A v* tag can point at any commit. Only commits on main are released,
      # so a tag on a side branch stops here.
      - name: Check that the tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main; only commits on main are released"
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The tag names the version (v0.1.0 releases 0.1.0). It has to agree
      # with `version=` in gradle.properties, otherwise the zip the build
      # produces would not be the one the tag claims to release.
      - name: Check the tag against gradle.properties
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          declared=$(sed -n 's/^version=//p' gradle.properties)
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME names version $version but gradle.properties declares version=$declared"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version"

      - name: Build, precommit, unit, integTest, multiNodeIntegTest
        run: ./gradlew --no-daemon --console=plain build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test-results/**/TEST-*.xml
            build/testclusters/*/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      # GitHub writes the release notes from the titles and authors of the
      # pull requests merged since the previous release.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "build/distributions/opensearch-lance-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --generate-notes
