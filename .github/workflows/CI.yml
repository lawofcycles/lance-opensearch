name: build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One lane per OpenSearch version. The release lane (3.8.0, the
    # version the plugin declares) is the required check; the two snapshot
    # lanes build against the next minors so an API drift shows up here
    # before the release ships, and continue-on-error keeps them from
    # blocking a pull request.
    name: build (${{ matrix.opensearch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        opensearch: ['3.8.0', '3.9.0-SNAPSHOT', '3.10.0-SNAPSHOT']
    continue-on-error: ${{ endsWith(matrix.opensearch, '-SNAPSHOT') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, precommit, unit, integTest, multiNodeIntegTest
        run: ./gradlew --no-daemon --console=plain build -Dopensearch.version=${{ matrix.opensearch }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.opensearch }}
          path: |
            build/test-results/**/TEST-*.xml
            build/testclusters/*/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
