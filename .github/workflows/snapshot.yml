name: snapshot

# The next two OpenSearch minors, weekly and on demand. A failure here
# points at an API drift in an upcoming OpenSearch and is worth reading;
# it never blocks a pull request.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.opensearch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        opensearch: ['3.9.0-SNAPSHOT', '3.10.0-SNAPSHOT']
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build, precommit, unit, integTest, multiNodeIntegTest
        run: ./gradlew --no-daemon --console=plain build -Dopensearch.version=${{ matrix.opensearch }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.opensearch }}
          path: |
            build/test-results/**/TEST-*.xml
            build/testclusters/*/logs/*.log
          if-no-files-found: ignore
          retention-days: 3
